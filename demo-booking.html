<!DOCTYPE html>
<html lang="zh-CN" data-canvas-width="420" data-canvas-height="1600">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>服务预约 Demo · 码侬·优你作品集</title>
<meta name="description" content="演示作品：预约类小程序 H5，服务列表、时段选择、预约表单与我的预约，前端 mock 数据。">
<style>
  @font-face{
    font-family:"Source Han Sans SC VF";
    src:url("https://lf-flow-web-cdn.doubao.com/obj/flow-doubao/doubao/infinite-canvas/fonts/v1/source-han-sans-sc-vf/source-han-sans-sc-vf.otf") format("opentype");
    font-weight:250 900;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --bg:#f5f8fc; --card:#ffffff; --line:#e3ecf3; --text:#16233a; --muted:#5f7186;
    --accent:#0ea5e9; --accent-dark:#2563eb; --accent-soft:#e0f2fe; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Source Han Sans SC VF",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  /* 手机容器：桌面预览居中窄栏，手机上全屏 */
  .phone{max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:72px}

  .topbar{padding:20px 18px 12px;background:var(--accent);color:#fff}
  .topbar h1{font-size:19px;font-weight:700}
  .topbar p{font-size:13px;opacity:.9}

  .section{padding:16px 14px}
  .section h2{font-size:15px;margin-bottom:12px;color:var(--text)}

  .svc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
  .svc.active{border-color:var(--accent);background:var(--accent-soft)}
  .svc .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .svc h3{font-size:16px}
  .svc .price{color:var(--accent-dark);font-weight:700;white-space:nowrap}
  .svc .meta{font-size:13px;color:var(--muted);margin-top:4px}

  .slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .slot{padding:8px 14px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fff;color:var(--text)}
  .slot.active{border-color:var(--accent);background:var(--accent);color:#fff}

  form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
  label{font-size:13px;color:var(--muted)}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--text)}
  textarea{min-height:64px;resize:vertical}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .btn:active{filter:brightness(.95)}
  .tip{font-size:12px;color:var(--muted)}

  .book{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .book .row{display:flex;justify-content:space-between;gap:10px}
  .book h3{font-size:15px}
  .book .status{font-size:12px;color:var(--accent-dark);background:var(--accent-soft);border-radius:6px;padding:2px 10px;white-space:nowrap}
  .book .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 0}

  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1px solid var(--line);display:flex}
  .tab{flex:1;text-align:center;padding:10px 0;font-size:12px;color:var(--muted);cursor:pointer}
  .tab.active{color:var(--accent-dark)}
  .tab .ico{font-size:18px;display:block}

  .view{display:none}
  .view.active{display:block}
  .demo-tag{position:fixed;right:12px;bottom:80px;background:var(--text);color:#fff;font-size:11px;border-radius:6px;padding:4px 10px;opacity:.85}
</style>
</head>
<body>
<div class="phone">

  <div class="topbar">
    <h1>示例服务预约</h1>
    <p>演示作品 Demo · 选择服务与时段，在线预约</p>
  </div>

  <!-- ===== 视图：服务预约 ===== -->
  <div class="view active" id="view-book">
    <div class="section">
      <h2>选择服务</h2>
      <div id="svcList"></div>
    </div>

    <div class="section">
      <h2>选择时段</h2>
      <div class="slots" id="slotList"></div>
    </div>

    <div class="section">
      <form id="bookForm">
        <div><label>称呼</label><input id="fName" type="text" placeholder="怎么称呼你"></div>
        <div><label>手机号</label><input id="fPhone" type="tel" placeholder="用于联系确认（演示 mock）"></div>
        <div><label>预约日期</label><input id="fDate" type="date"></div>
        <div><label>备注（可选）</label><textarea id="fNote" placeholder="特殊需求或说明"></textarea></div>
        <button class="btn" type="submit">提交预约（演示）</button>
        <p class="tip">本页面为前端演示，数据不发送到后端；正式上线后对接接口与真实预约系统。</p>
      </form>
    </div>
  </div>

  <!-- ===== 视图：我的预约 ===== -->
  <div class="view" id="view-mine">
    <div class="section">
      <h2>我的预约</h2>
      <div id="mineList"></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active" data-view="view-book"><span class="ico">📅</span>预约</div>
    <div class="tab" data-view="view-mine"><span class="ico">📋</span>我的预约</div>
  </div>
  <div class="demo-tag">Demo</div>
</div>

<script>
  // ===== mock 数据 =====
  const services = [
    { id:1, name:'基础理发造型', dur:'约 40 分钟', price:'¥68' },
    { id:2, name:'深度护理套餐', dur:'约 70 分钟', price:'¥128' },
    { id:3, name:'咨询定制方案', dur:'约 30 分钟', price:'¥50' }
  ];
  const slots = ['10:00','11:00','13:30','14:30','16:00','17:30'];
  let state = { svcId:1, slot:'' };
  let bookings = [
    { svc:'基础理发造型', slot:'14:30', date:'2026-11-25', name:'示例客户', status:'已确认' }
  ];

  const $ = id => document.getElementById(id);

  function renderServices(){
    $('svcList').innerHTML = services.map(s =>
      `<div class="svc ${state.svcId===s.id?'active':''}" data-id="${s.id}">
        <div class="row"><h3>${s.name}</h3><span class="price">${s.price}</span></div>
        <div class="meta">${s.dur}</div>
      </div>`).join('');
    document.querySelectorAll('.svc').forEach(el=>{
      el.onclick = ()=>{ state.svcId = +el.dataset.id; state.slot=''; renderServices(); renderSlots(); };
    });
  }
  function renderSlots(){
    $('slotList').innerHTML = slots.map(t=>
      `<div class="slot ${state.slot===t?'active':''}" data-t="${t}">${t}</div>`).join('');
    document.querySelectorAll('.slot').forEach(el=>{
      el.onclick = ()=>{ state.slot = el.dataset.t; renderSlots(); };
    });
  }
  function renderMine(){
    if(!bookings.length){ $('mineList').innerHTML = '<div class="empty">暂无预约记录</div>'; return; }
    $('mineList').innerHTML = bookings.map(b=>
      `<div class="book">
        <div class="row"><h3>${b.svc}</h3><span class="status">${b.status}</span></div>
        <div class="meta">${b.date} · ${b.slot} · ${b.name}</div>
        ${b.note?`<div class="meta">备注：${b.note}</div>`:''}
      </div>`).join('');
  }

  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      t.classList.add('active');
      $(t.dataset.view).classList.add('active');
      if(t.dataset.view==='view-mine') renderMine();
    };
  });

  $('bookForm').onsubmit = function(e){
    e.preventDefault();
    const svc = services.find(s=>s.id===state.svcId);
    const name = $('fName').value.trim() || '未填写';
    const phone = $('fPhone').value.trim();
    const date = $('fDate').value || '待定';
    const note = $('fNote').value.trim();
    if(!state.slot){ alert('请先选择时段'); return; }
    bookings.unshift({ svc:svc.name, slot:state.slot, date, name, note, status:'待确认' });
    this.reset(); state.slot=''; renderSlots(); renderMine();
    document.querySelector('.tab[data-view="view-mine"]').click();
  };

  renderServices(); renderSlots(); renderMine();
</script>
</body>
</html>
